<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a2e">
<title>Flappy Bull 🐂</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: #1a0a2e;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100dvh; overflow: hidden;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  touch-action: none;
}
#gameContainer {
  position: relative; width: 100%; max-width: 420px; height: 100dvh; overflow: hidden;
}
canvas { width: 100%; height: 100%; display: block; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10,4,30,0.85); backdrop-filter: blur(6px); z-index: 50;
}
.screen.hidden { display: none; }
.card {
  background: linear-gradient(145deg, #1e0d40, #2d1060);
  border: 2px solid rgba(255,200,50,0.3); border-radius: 28px;
  padding: 32px 28px; text-align: center; width: 88%; max-width: 340px;
  box-shadow: 0 0 60px rgba(255,160,20,0.15);
}
.game-title { font-size: 44px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 3px 0 #8b6914; line-height: 1; }
.game-sub { color: #ffaa00; font-size: 14px; margin-top: 4px; letter-spacing: 3px; }
.bird-icon { font-size: 72px; margin: 16px 0; animation: hover 2s ease-in-out infinite; display: block; }
@keyframes hover { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.best-score { color: #aaa; font-size: 13px; margin-bottom: 20px; }
.best-score span { color: #ffd700; font-size: 18px; font-weight: 900; }
.btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 50px; cursor: pointer; font-size: 20px; font-weight: 900; }
.btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a0a2e; box-shadow: 0 6px 20px rgba(255,180,0,0.4); }
.btn-secondary { background: transparent; border: 2px solid rgba(255,200,0,0.3); color: #ffaa00; font-size: 15px; padding: 12px; margin-top: 10px; }
#hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; z-index: 30; pointer-events: none; }
.hud-score { font-size: 48px; font-weight: 900; color: white; text-shadow: 0 3px 0 rgba(0,0,0,0.5); line-height: 1; }
.hud-best { text-align: right; font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.8; }
.hud-best span { color: #ffd700; font-size: 16px; font-weight: 900; display: block; }
.medal { font-size: 48px; margin: 8px 0; }
.score-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
.score-row:last-child { border-bottom: none; }
.score-row label { color: #aaa; font-size: 13px; }
.score-row value { color: #fff; font-size: 20px; font-weight: 900; }
#tapHint { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 16px; text-align: center; z-index: 30; pointer-events: none; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
#tapHint.hidden { display: none; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-score" id="scoreDisplay">0</div>
    <div class="hud-best">BEST<span id="bestDisplay">0</span></div>
  </div>
  <div id="tapHint" class="hidden">TAP TO FLY! 🐂</div>
  <div class="screen" id="startScreen">
    <div class="card">
      <div class="game-title">FLAPPY<br>BULL</div>
      <div class="game-sub">🐂 THE BIG BULL</div>
      <div class="bird-icon">🐂</div>
      <div class="best-score">Best Score: <span id="bestStart">0</span></div>
      <button class="btn btn-primary" id="startBtn">▶ PLAY NOW</button>
    </div>
  </div>
  <div class="screen hidden" id="gameOverScreen">
    <div class="card">
      <div class="game-title" style="font-size:36px;color:#ff4444;">GAME OVER</div>
      <div class="medal" id="medalDisplay">💀</div>
      <div class="score-row"><label>SCORE</label><value id="goScore">0</value></div>
      <div class="score-row"><label>BEST</label><value id="goBest" style="color:#ffd700">0</value></div>
      <button class="btn btn-primary" id="retryBtn" style="margin-top:20px">🔄 TRY AGAIN</button>
      <button class="btn btn-secondary" id="menuBtn">🏠 MENU</button>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const container=document.getElementById('gameContainer');
let W,H;
function resize(){W=canvas.width=container.clientWidth;H=canvas.height=container.clientHeight;}
resize();
window.addEventListener('resize',()=>{resize();if(state==='idle')drawIdle();});
let state='menu';
let score=0,bestScore=parseInt(localStorage.getItem('flappyBest')||'0');
let animFrame;
const bird={x:0,y:0,vy:0,vr:0,r:0,alive:true,flapFrames:0,trail:[]};
let pipes=[],particles=[],stars=[],clouds=[],groundOffset=0;
const GRAVITY=0.18;
const FLAP=-5.5;
const PIPE_W=60;
const PIPE_GAP=()=>Math.max(H*0.45,280);
const PIPE_SPEED=()=>1.6+score*0.01;
const PIPE_INTERVAL=2400;
function initStars(){stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.75,r:Math.random()*1.8+0.3,twinkle:Math.random()*Math.PI*2,speed:Math.random()*0.04+0.01});}
function initClouds(){clouds=[];for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*0.25,w:80+Math.random()*100,speed:0.3+Math.random()*0.4,alpha:0.15+Math.random()*0.2});}
function initBird(){bird.x=W*0.28;bird.y=H*0.45;bird.vy=0;bird.vr=0;bird.r=0;bird.alive=true;bird.flapFrames=0;bird.trail=[];}
function addPipe(){const gap=PIPE_GAP();const minTop=H*0.12;const maxTop=H*0.65-gap;const topH=minTop+Math.random()*(maxTop-minTop);pipes.push({x:W+PIPE_W,topH,botY:topH+gap,passed:false,color:['#2ecc40','#00b894','#0984e3','#6c5ce7','#e17055'][Math.floor(Math.random()*5)]});}
function flap(){
  if(state==='menu')return;
  if(state==='idle'){state='playing';document.getElementById('tapHint').classList.add('hidden');scheduleNextPipe();}
  if(state!=='playing')return;
  bird.vy=FLAP;bird.flapFrames=8;
  for(let i=0;i<5;i++)particles.push({x:bird.x-10,y:bird.y+5,vx:-2-Math.random()*2,vy:(Math.random()-0.5)*4,r:4+Math.random()*4,alpha:0.8,color:Math.random()>0.5?'#ffd700':'#fff',type:'flap'});
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
document.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
canvas.addEventListener('mousedown',e=>{e.preventDefault();flap();});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);
document.getElementById('menuBtn').addEventListener('click',showMenu);
let pipeTimer;
function scheduleNextPipe(){clearTimeout(pipeTimer);pipeTimer=setTimeout(()=>{if(state==='playing'){addPipe();scheduleNextPipe();}},PIPE_INTERVAL);}
function checkCollision(){
  const bx=bird.x,by=bird.y,br=9;
  const GROUND_Y=H-60;
  if(by+br>=GROUND_Y||by-br<=0)return true;
  for(const p of pipes){if(bx+br>p.x-2&&bx-br<p.x+PIPE_W+2){if(by-br<p.topH||by+br>p.botY)return true;}}
  return false;
}
function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('tapHint').classList.remove('hidden');
  score=0;pipes=[];particles=[];
  document.getElementById('scoreDisplay').textContent='0';
  document.getElementById('bestDisplay').textContent=bestScore;
  initBird();initStars();initClouds();state='idle';
  cancelAnimationFrame(animFrame);loop();
}
function showMenu(){
  state='menu';cancelAnimationFrame(animFrame);clearTimeout(pipeTimer);
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('tapHint').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('bestStart').textContent=bestScore;
  initStars();initClouds();initBird();pipes=[];particles=[];drawIdle();
}
function killBird(){
  if(!bird.alive)return;bird.alive=false;state='dead';clearTimeout(pipeTimer);
  for(let i=0;i<22;i++){const a=(i/22)*Math.PI*2,sp=3+Math.random()*5;particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:6+Math.random()*8,alpha:1,color:['#ffd700','#ff4444','#ff8c00','#fff'][i%4],type:'death'});}
  if(score>bestScore){bestScore=score;localStorage.setItem('flappyBest',bestScore);}
  setTimeout(()=>{
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('goScore').textContent=score;
    document.getElementById('goBest').textContent=bestScore;
    document.getElementById('medalDisplay').textContent=score>=40?'🏆':score>=20?'🥇':score>=10?'🥈':score>=5?'🥉':'💀';
    document.getElementById('gameOverScreen').classList.remove('hidden');
  },900);
}
function lighten(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.min(255,r+180*amt)},${Math.min(255,g+180*amt)},${Math.min(255,b+180*amt)})`;}
function darken(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.max(0,r-160*amt)},${Math.max(0,g-160*amt)},${Math.max(0,b-160*amt)})`;}
function drawPipe(x,y,h,color,isTop){
  if(h<=0)return;const CAP=14;
  const g=ctx.createLinearGradient(x,0,x+PIPE_W,0);
  g.addColorStop(0,darken(color,0.3));g.addColorStop(0.3,lighten(color,0.2));g.addColorStop(0.7,color);g.addColorStop(1,darken(color,0.4));
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+4,y,PIPE_W-8,h,3);ctx.fill();
  const capY=isTop?y+h-CAP:y;
  const g2=ctx.createLinearGradient(x-4,0,x+PIPE_W+4,0);
  g2.addColorStop(0,darken(color,0.2));g2.addColorStop(0.4,lighten(color,0.3));g2.addColorStop(1,darken(color,0.3));
  ctx.fillStyle=g2;ctx.beginPath();ctx.roundRect(x,capY,PIPE_W,CAP,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(x+8,y+4,8,h-8,2);ctx.fill();
}
let flashAlpha=0;
let idleT=0;
function drawIdle(){
  idleT+=0.03;ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0d0130');sky.addColorStop(0.6,'#1a0a3e');sky.addColorStop(1,'#0d2010');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.twinkle+=s.speed;const a=0.4+0.5*Math.sin(s.twinkle);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();});
  const GROUND_Y=H-60;ctx.fillStyle='#1a5e20';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);ctx.fillStyle='#2d8f33';ctx.fillRect(0,GROUND_Y,W,12);
  bird.y=H*0.45+Math.sin(idleT)*15;bird.r=Math.sin(idleT)*10;
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.r*Math.PI/180);ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,200,0,0.4)';ctx.shadowBlur=15;ctx.fillText('🐂',0,0);ctx.restore();
  if(state==='menu')animFrame=requestAnimationFrame(drawIdle);
}
function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0d0130');sky.addColorStop(0.6,'#1a0a3e');sky.addColorStop(1,'#0d2010');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.twinkle+=s.speed;const a=0.4+0.5*Math.sin(s.twinkle);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();});
  const GROUND_Y=H-60;
  if(state==='playing')groundOffset=(groundOffset+PIPE_SPEED())%40;
  pipes=pipes.filter(p=>p.x+PIPE_W>-10);
  pipes.forEach(p=>{
    if(state==='playing')p.x-=PIPE_SPEED();
    if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;document.getElementById('scoreDisplay').textContent=score;flashAlpha=0.35;for(let i=0;i<6;i++)particles.push({x:bird.x+30+(Math.random()-0.5)*20,y:bird.y-20,vx:(Math.random()-0.5)*3,vy:-2-Math.random()*3,alpha:1,r:4,color:'#ffd700',type:'score'});}
    drawPipe(p.x,0,p.topH,p.color,true);
    drawPipe(p.x,p.botY,GROUND_Y-p.botY,p.color,false);
  });
  ctx.fillStyle='#1a5e20';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);ctx.fillStyle='#2d8f33';ctx.fillRect(0,GROUND_Y,W,12);
  ctx.strokeStyle='#1a5e20';ctx.lineWidth=2;
  for(let x=-40+groundOffset;x<W+40;x+=40){ctx.beginPath();ctx.moveTo(x,GROUND_Y);ctx.lineTo(x-40,GROUND_Y+48);ctx.stroke();}
  if(state==='idle'){idleT+=0.04;bird.y=H*0.45+Math.sin(idleT)*12;bird.r=Math.sin(idleT)*8;}
  else if(state==='playing'){bird.vy+=GRAVITY;bird.y+=bird.vy;const targetR=Math.max(-25,Math.min(70,bird.vy*4));bird.r+=(targetR-bird.r)*0.18;if(bird.flapFrames>0)bird.flapFrames--;bird.trail.unshift({x:bird.x,y:bird.y});if(bird.trail.length>8)bird.trail.pop();if(checkCollision())killBird();}
  else if(state==='dead'){bird.vy+=GRAVITY*1.5;bird.y+=bird.vy;bird.r=Math.min(bird.r+8,90);}
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.r*Math.PI/180);
  bird.trail.forEach((t,i)=>{const a=(i/bird.trail.length)*0.25;ctx.beginPath();ctx.arc(t.x-bird.x,t.y-bird.y,18*(i/bird.trail.length),0,Math.PI*2);ctx.fillStyle=`rgba(255,200,0,${a})`;ctx.fill();});
  ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,200,0,0.4)';ctx.shadowBlur=15;ctx.fillText('🐂',0,0);ctx.restore();
  particles=particles.filter(p=>p.alpha>0.02);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.alpha-=0.028;p.r*=0.97;ctx.globalAlpha=p.alpha;if(p.type==='score'){ctx.font='bold 15px Arial';ctx.fillStyle=p.color;ctx.textAlign='center';ctx.fillText('+1',p.x,p.y);}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();}ctx.globalAlpha=1;});
  if(flashAlpha>0){ctx.fillStyle=`rgba(255,230,0,${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha-=0.04;}
  animFrame=requestAnimationFrame(loop);
}
document.getElementById('bestStart').textContent=bestScore;
initStars();initClouds();initBird();
drawIdle();
</script>
</body>
</html>
