<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a2e">
<title>Flappy Bull</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a2e;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;}
#wrap{position:relative;width:360px;height:600px;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.panel{background:linear-gradient(145deg,#1e0d40,#2d1060);border:2px solid rgba(255,200,50,0.4);border-radius:24px;padding:28px 24px;text-align:center;width:82%;}
.title{font-size:40px;font-weight:900;color:#ffd700;text-shadow:0 3px 0 #8b6914;font-family:Arial Black,sans-serif;line-height:1.1;}
.sub{color:#ffaa00;font-size:13px;letter-spacing:2px;margin-top:4px;}
.icon{font-size:64px;margin:12px 0;display:block;animation:hov 2s ease-in-out infinite;}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.best{color:#aaa;font-size:13px;margin-bottom:16px;}
.best span{color:#ffd700;font-weight:900;font-size:17px;}
.playbtn{display:block;width:100%;padding:15px;border:none;border-radius:50px;font-size:20px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a0a2e;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.playbtn:active{opacity:0.85;transform:scale(0.97);}
.retrybtn{display:block;width:100%;padding:15px;border:none;border-radius:50px;font-size:18px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a0a2e;cursor:pointer;margin-top:16px;-webkit-tap-highlight-color:transparent;}
.retrybtn:active{opacity:0.85;}
.menubtn{display:block;width:100%;padding:11px;border:2px solid rgba(255,200,0,0.3);border-radius:50px;font-size:14px;font-weight:700;background:transparent;color:#ffaa00;cursor:pointer;margin-top:10px;-webkit-tap-highlight-color:transparent;}
#score{position:absolute;top:14px;left:18px;font-size:50px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,0.5);font-family:Arial Black,sans-serif;line-height:1;pointer-events:none;}
#bestshow{position:absolute;top:14px;right:18px;text-align:right;font-size:11px;color:rgba(255,255,255,0.6);line-height:1.8;pointer-events:none;}
#bestshow span{color:#ffd700;font-size:15px;font-weight:900;display:block;}
#tapHint{position:absolute;bottom:32%;width:100%;text-align:center;color:rgba(255,255,255,0.8);font-size:17px;font-weight:700;pointer-events:none;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.srow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.1);}
.srow:last-child{border:none;}
.srow label{color:#aaa;font-size:12px;}
.srow val{color:#fff;font-size:19px;font-weight:900;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="600"></canvas>

  <!-- Score HUD -->
  <div id="score" style="display:none">0</div>
  <div id="bestshow" style="display:none">BEST<span id="bval">0</span></div>
  <div id="tapHint" style="display:none">👆 TAP TO FLY!</div>

  <!-- Menu -->
  <div id="ui">
    <div id="menuPanel" class="panel">
      <div class="title">FLAPPY<br>BULL</div>
      <div class="sub">🐂 THE BIG BULL</div>
      <span class="icon">🐂</span>
      <div class="best">Best: <span id="bestMenu">0</span></div>
      <button class="playbtn" id="playBtn">▶ PLAY NOW</button>
    </div>

    <!-- Game Over -->
    <div id="goPanel" class="panel" style="display:none">
      <div class="title" style="font-size:32px;color:#ff4444;">GAME OVER</div>
      <div style="font-size:44px;margin:10px 0" id="medal">💀</div>
      <div class="srow"><label>SCORE</label><val id="goScore">0</val></div>
      <div class="srow"><label>BEST</label><val id="goBest" style="color:#ffd700">0</val></div>
      <button class="retrybtn" id="retryBtn">🔄 TRY AGAIN</button>
      <button class="menubtn" id="menuBtn">🏠 MENU</button>
    </div>
  </div>
</div>

<script>
var c=document.getElementById('c');
var ctx=c.getContext('2d');
var W=360,H=600;

var GRAVITY=0.18,FLAP=-5.5,PIPE_W=58,PIPE_GAP=285,PIPE_SPEED=1.6,PIPE_INT=2400;

var state='menu';
var bird,pipes,particles,score,best,goff,idleT,flashA,pipeTimer;
best=parseInt(localStorage.getItem('fb')||'0');

function initGame(){
  bird={x:100,y:H/2,vy:0,r:0,trail:[]};
  pipes=[];particles=[];score=0;goff=0;idleT=0;flashA=0;
  clearTimeout(pipeTimer);
}

function addPipe(){
  var gap=PIPE_GAP;
  var minT=70,maxT=H-60-gap-70;
  var tH=minT+Math.random()*(maxT-minT);
  var cols=['#2ecc40','#00b894','#0984e3','#9b59b6','#e67e22'];
  pipes.push({x:W+PIPE_W,tH:tH,bY:tH+gap,passed:false,col:cols[Math.floor(Math.random()*5)]});
}

function schedulePipe(){
  clearTimeout(pipeTimer);
  pipeTimer=setTimeout(function(){
    if(state==='play'){addPipe();schedulePipe();}
  },PIPE_INT);
}

function doFlap(){
  if(state==='menu')return;
  if(state==='idle'){
    state='play';
    document.getElementById('tapHint').style.display='none';
    schedulePipe();
  }
  if(state!=='play')return;
  bird.vy=FLAP;
  for(var i=0;i<5;i++)particles.push({x:bird.x-8,y:bird.y+4,vx:-1.5-Math.random()*2,vy:(Math.random()-0.5)*4,r:4+Math.random()*3,a:0.8,col:Math.random()>0.5?'#ffd700':'#fff'});
}

// ALL input methods
document.getElementById('playBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();startGame();},{passive:false});
document.getElementById('playBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});
document.getElementById('retryBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();startGame();},{passive:false});
document.getElementById('retryBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});
document.getElementById('menuBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();showMenu();},{passive:false});
document.getElementById('menuBtn').addEventListener('click',function(e){e.stopPropagation();showMenu();});

document.getElementById('c').addEventListener('touchstart',function(e){e.preventDefault();doFlap();},{passive:false});
document.getElementById('c').addEventListener('mousedown',function(e){doFlap();});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();doFlap();}});

function startGame(){
  initGame();
  document.getElementById('menuPanel').style.display='none';
  document.getElementById('goPanel').style.display='none';
  document.getElementById('ui').style.display='none';
  document.getElementById('score').style.display='block';
  document.getElementById('bestshow').style.display='block';
  document.getElementById('tapHint').style.display='block';
  document.getElementById('score').textContent='0';
  document.getElementById('bval').textContent=best;
  state='idle';
}

function showMenu(){
  clearTimeout(pipeTimer);
  state='menu';
  initGame();
  document.getElementById('ui').style.display='flex';
  document.getElementById('menuPanel').style.display='block';
  document.getElementById('goPanel').style.display='none';
  document.getElementById('score').style.display='none';
  document.getElementById('bestshow').style.display='none';
  document.getElementById('tapHint').style.display='none';
  document.getElementById('bestMenu').textContent=best;
}

function gameOver(){
  state='dead';
  clearTimeout(pipeTimer);
  // death particles
  for(var i=0;i<20;i++){
    var a=(i/20)*Math.PI*2,sp=3+Math.random()*5;
    particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:6+Math.random()*7,a:1,col:['#ffd700','#ff4444','#ff8c00','#fff'][i%4]});
  }
  if(score>best){best=score;localStorage.setItem('fb',best);}
  setTimeout(function(){
    document.getElementById('score').style.display='none';
    document.getElementById('bestshow').style.display='none';
    document.getElementById('tapHint').style.display='none';
    document.getElementById('goScore').textContent=score;
    document.getElementById('goBest').textContent=best;
    document.getElementById('medal').textContent=score>=40?'🏆':score>=20?'🥇':score>=10?'🥈':score>=5?'🥉':'💀';
    document.getElementById('ui').style.display='flex';
    document.getElementById('goPanel').style.display='block';
  },800);
}

function lk(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgb('+Math.min(255,r+180*a)+','+Math.min(255,g+180*a)+','+Math.min(255,b+180*a)+')';}
function dk(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgb('+Math.max(0,r-160*a)+','+Math.max(0,g-160*a)+','+Math.max(0,b-160*a)+')';}

function drawPipe(x,y,h,col,isTop){
  if(h<=0)return;
  var CAP=14;
  var g=ctx.createLinearGradient(x,0,x+PIPE_W,0);
  g.addColorStop(0,dk(col,0.3));g.addColorStop(0.3,lk(col,0.2));g.addColorStop(0.7,col);g.addColorStop(1,dk(col,0.4));
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+4,y,PIPE_W-8,h,3);ctx.fill();
  var cy=isTop?y+h-CAP:y;
  var g2=ctx.createLinearGradient(x-4,0,x+PIPE_W+4,0);
  g2.addColorStop(0,dk(col,0.2));g2.addColorStop(0.4,lk(col,0.3));g2.addColorStop(1,dk(col,0.3));
  ctx.fillStyle=g2;ctx.beginPath();ctx.roundRect(x,cy,PIPE_W,CAP,4);ctx.fill();
}

function frame(){
  // sky
  var sk=ctx.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#0d0130');sk.addColorStop(0.6,'#1a0a3e');sk.addColorStop(1,'#0a2010');
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);

  // stars
  for(var i=0;i<50;i++){
    var sx=((i*137+73)%W),sy=((i*97+19)%(H*0.7));
    var tw=Math.sin(Date.now()*0.001+i)*0.3+0.6;
    ctx.globalAlpha=tw*0.6;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sx,sy,i%3===0?1.4:0.8,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  var GY=H-55;
  var spd=PIPE_SPEED+(score*0.01);

  // pipes
  pipes=pipes.filter(function(p){return p.x+PIPE_W>-5;});
  pipes.forEach(function(p){
    if(state==='play')p.x-=spd;
    if(!p.passed&&p.x+PIPE_W<bird.x){
      p.passed=true;score++;
      document.getElementById('score').textContent=score;
      flashA=0.4;
      for(var i=0;i<5;i++)particles.push({x:bird.x+30,y:bird.y,vx:(Math.random()-0.5)*3,vy:-2-Math.random()*3,r:4,a:1,col:'#ffd700',txt:true});
    }
    drawPipe(p.x,0,p.tH,p.col,true);
    drawPipe(p.x,p.bY,GY-p.bY,p.col,false);
  });

  // ground
  if(state==='play')goff=(goff+spd)%40;
  ctx.fillStyle='#1a5e20';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#2d8f33';ctx.fillRect(0,GY,W,10);
  ctx.strokeStyle='#155218';ctx.lineWidth=2;
  for(var x=-40+goff;x<W+40;x+=40){ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x-40,GY+55);ctx.stroke();}

  // bird physics
  if(state==='idle'){
    idleT+=0.04;bird.y=H/2+Math.sin(idleT)*12;bird.r=Math.sin(idleT)*8;
  } else if(state==='play'){
    bird.vy+=GRAVITY;bird.y+=bird.vy;
    var tR=Math.max(-25,Math.min(70,bird.vy*4));
    bird.r+=(tR-bird.r)*0.2;
    bird.trail.unshift({x:bird.x,y:bird.y});
    if(bird.trail.length>7)bird.trail.pop();
    // collision
    var br=9,hit=false;
    if(bird.y+br>=GY||bird.y-br<=0)hit=true;
    for(var i=0;i<pipes.length&&!hit;i++){
      var p=pipes[i];
      if(bird.x+br>p.x&&bird.x-br<p.x+PIPE_W){
        if(bird.y-br<p.tH||bird.y+br>p.bY)hit=true;
      }
    }
    if(hit)gameOver();
  } else if(state==='dead'){
    bird.vy+=GRAVITY*1.5;bird.y+=bird.vy;bird.r=Math.min(bird.r+8,90);
  }

  // draw bird trail
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.r*Math.PI/180);
  bird.trail.forEach(function(t,i){
    var a=(i/bird.trail.length)*0.2;
    ctx.beginPath();ctx.arc(t.x-bird.x,t.y-bird.y,15*(i/Math.max(bird.trail.length,1)),0,Math.PI*2);
    ctx.fillStyle='rgba(255,200,0,'+a+')';ctx.fill();
  });
  ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(255,200,0,0.5)';ctx.shadowBlur=14;
  ctx.fillText('🐂',0,0);ctx.restore();

  // particles
  particles=particles.filter(function(p){return p.a>0.02;});
  particles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.a-=0.025;p.r*=0.97;
    ctx.globalAlpha=p.a;
    if(p.txt){ctx.font='bold 14px Arial';ctx.fillStyle='#ffd700';ctx.textAlign='center';ctx.fillText('+1',p.x,p.y);}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}
    ctx.globalAlpha=1;
  });

  // flash
  if(flashA>0){ctx.fillStyle='rgba(255,230,0,'+flashA+')';ctx.fillRect(0,0,W,H);flashA-=0.05;}

  requestAnimationFrame(frame);
}

// init
document.getElementById('bestMenu').textContent=best;
initGame();
frame();
</script>
</body>
</html>
